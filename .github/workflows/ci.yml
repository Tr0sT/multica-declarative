name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o ./bin/multica-declarative ./cmd/multica-declarative
      - run: ./bin/multica-declarative --version
      - run: ./bin/multica-declarative validate --config examples/basic/multica.yaml
      - name: Install pinned official CLI for compatibility tests
        run: |
          version=$(jq -r .version integration/multica.lock.json)
          checksum=$(jq -r .linux_amd64_sha256 integration/multica.lock.json)
          archive="$RUNNER_TEMP/multica.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/multica-ai/multica/releases/download/v${version}/multica-cli-${version}-linux-amd64.tar.gz"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" multica
      - name: Real CLI contracts and round-trip regressions
        run: MULTICA_BIN="$RUNNER_TEMP/multica" make integration
