name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            gofmt -d .
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o ./bin/multica-declarative ./cmd/multica-declarative
      - run: ./bin/multica-declarative --version
      - run: ./bin/multica-declarative validate --config examples/basic/multica.yaml
      - name: Validate optional TeamBridge example without credentials or a server
        run: ./bin/multica-declarative validate --config examples/teambridge/multica.yaml
      - name: Validate workspace-set examples without contacting Multica
        run: |
          ./bin/multica-declarative validate --config examples/workspace-set/multica.yaml
          ./bin/multica-declarative validate --config examples/workspace-set/experiments/multica.yaml
      - name: Install pinned official CLI for compatibility tests
        run: |
          version=$(jq -r .version integration/multica.lock.json)
          checksum=$(jq -r .linux_amd64_sha256 integration/multica.lock.json)
          archive="$RUNNER_TEMP/multica.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/multica-ai/multica/releases/download/v${version}/multica-cli-${version}-linux-amd64.tar.gz"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" multica
      - name: Real CLI contracts and round-trip regressions
        run: MULTICA_BIN="$RUNNER_TEMP/multica" make integration

  teambridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned TeamBridge CLI revision
        id: fork
        run: |
          repository=$(jq -er .repository integration/multica-teambridge.lock.json)
          revision=$(jq -er .revision integration/multica-teambridge.lock.json)
          test "$repository" = 'Tr0sT/multica'
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          printf 'repository=%s\nrevision=%s\n' "$repository" "$revision" >> "$GITHUB_OUTPUT"
      - name: Check out pinned fork CLI source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.fork.outputs.repository }}
          ref: ${{ steps.fork.outputs.revision }}
          path: .teambridge-cli-source
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .teambridge-cli-source/server/go.mod
          cache-dependency-path: |
            go.sum
            .teambridge-cli-source/server/go.sum
          cache: true
      - name: Build pinned TeamBridge CLI
        working-directory: .teambridge-cli-source/server
        run: go build -o "$RUNNER_TEMP/multica-teambridge" ./cmd/multica
      - name: Real fork CLI TeamBridge contracts and round-trip regressions
        run: MULTICA_BIN="$RUNNER_TEMP/multica-teambridge" make integration-teambridge
